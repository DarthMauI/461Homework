<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Cube with Spinning Mars</title>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  </head>

  <body>
    <a-scene>

      <a-assets>
        <img id="mars" src="./IMAGES/mars-surface.avif">
      </a-assets>

      <a-entity camera look-controls wasd-controls position="0 1.6 0"></a-entity>

      <a-entity position="0 1.5 -5"
                animation="property: rotation; to: 0 360 0; loop: true; dur: 10000">


        <a-box color="#AAAAAA" opacity="0.3">


          <a-sphere radius="0.5" material="src: #mars"></a-sphere>

        </a-box>

      </a-entity>


      <a-plane position="0 0 -5" rotation="-90 0 0" width="10" height="10" color="#7BC8A4"></a-plane>


      <a-sky color="#000"></a-sky>

    </a-scene>
  </body>
</html>
