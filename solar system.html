
<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Solar System</title>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  </head>

  <body>
    <a-scene>

      <!-- Assets -->
      <a-assets>
        <img id="sunTex" src="./IMAGESFORSOLAR/sun.jpg">
        <img id="mercuryTex" src="./IMAGESFORSOLAR/mercury.jpg">
        <img id="venusTex" src="./IMAGESFORSOLAR/venus.jpg">
        <img id="earthTex" src="./IMAGESFORSOLAR/earth.jpg">
        <img id="marsTex" src="./IMAGESFORSOLAR/mars.jpg">
      </a-assets>

      <!-- Camera -->
      <a-entity camera look-controls wasd-controls position="0 2 10"></a-entity>

      <!-- Lights -->
      <a-light type="ambient" intensity="0.6"></a-light>
      <a-light type="point" intensity="2" position="0 2 -5"></a-light>

      <!-- Sun -->
<a-entity position="0 1 -5">

  <!-- Sun sphere -->
  <a-sphere
    radius="1.6"
    material="src: #sunTex; emissive: #ffaa00; emissiveIntensity: 0.4">
  </a-sphere>

  <!-- Sun label -->
  <a-text value="Sun"
          position="0 2.2 0"
          align="center"
          color="white"
          billboard>
  </a-text>

</a-entity>

      <!-- Mercury -->
      <a-entity position="0 1 -5"
                animation="property: rotation; to: 0 360 0; loop: true; dur: 4000">
        <a-sphere position="3 0 0" radius="0.5"
                  material="src: #mercuryTex"></a-sphere>

        <a-text value="Mercury" position="3 1 0" align="center" color="white" billboard></a-text>
      </a-entity>

      <!-- Venus -->
      <a-entity position="0 1 -5"
                animation="property: rotation; to: 0 360 0; loop: true; dur: 6000">
        <a-sphere position="5 0 0" radius="0.6"
                  material="src: #venusTex"></a-sphere>

        <a-text value="Venus" position="5 1 0" align="center" color="white" billboard></a-text>
      </a-entity>

      <!-- Earth -->
      <a-entity position="0 1 -5"
                animation="property: rotation; to: 0 360 0; loop: true; dur: 8000">
        <a-sphere position="7 0 0" radius="0.7"
                  material="src: #earthTex"></a-sphere>

        <a-text value="Earth" position="7 1 0" align="center" color="white" billboard></a-text>
      </a-entity>

      <!-- Mars -->
      <a-entity position="0 1 -5"
                animation="property: rotation; to: 0 360 0; loop: true; dur: 10000">
        <a-sphere position="9 0 0" radius="0.6"
                  material="src: #marsTex"></a-sphere>

        <a-text value="Mars" position="9 1 0" align="center" color="white" billboard></a-text>
      </a-entity>

      <!-- Sky -->
      <a-sky color="black"></a-sky>

    </a-scene>

    <!-- Billboard -->
    <script>
      AFRAME.registerComponent('billboard', {
        tick: function () {
          this.el.object3D.lookAt(
            this.el.sceneEl.camera.el.object3D.position
          );
        }
      });
    </script>

  </body>
</html>
